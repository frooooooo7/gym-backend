name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  smoke:
    name: End-to-end smoke tests (Postgres)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gym
          POSTGRES_PASSWORD: gym
          POSTGRES_DB: gym_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gym -d gym_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Migrations run when each smoke server starts.
      DATABASE_URL: postgresql://gym:gym@localhost:5432/gym_smoke
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-0123456789
      SMOKE_SERVER: dist
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run smoke

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config -q

      - name: Build image (no push)
        run: docker build --tag gym-backend:ci .
