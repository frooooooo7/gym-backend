services:
  postgres:
    # Plain PostgreSQL: the API needs only the contrib extensions pgcrypto and
    # pg_trgm, both bundled with the official image. (Previously
    # postgis/postgis:16-3.4-alpine — see README "Migrating from the PostGIS image".)
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gym
      # No default: a database reachable with the password "gym" is an open door.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: gym
    ports:
      # Loopback only. Set POSTGRES_BIND=0.0.0.0 to reach it from other hosts.
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym -d gym"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Loopback only by default; put a TLS reverse proxy in front for real
      # traffic (or set API_BIND=0.0.0.0 to test from a phone on the LAN).
      - "${API_BIND:-127.0.0.1}:${API_PORT:-3000}:3000"
    environment:
      # Default development so local Flutter web (any localhost port) works without CORS_ORIGIN.
      # For production-like runs: NODE_ENV=production JWT_SECRET=... CORS_ORIGIN=https://app.example.com
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "3000"
      DATABASE_URL: postgresql://gym:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/gym
      # Required — generate with `openssl rand -base64 48`.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # false = no reverse proxy in front (the port above is published directly);
      # set to the number of proxy hops when running behind nginx/Caddy/etc.
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # Recommended when NODE_ENV=production (comma-separated). Example Flutter web: http://localhost:65425
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # Exercise images and avatars survive image rebuilds / container recreation.
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
  uploads_data:
